# yazi-current keymap. Bindings that spawn commands in floating zellij panes.
#
# Tokens: %f (hovered), %F (selected), %d (cwd), %D (dirname of %f), %%.
# Absolute path to wrapper is required — yazi doesn't expand ~ in `shell`.

[mgr]
prepend_keymap = [
    { on = ["c", "f"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-float.sh "file %f" "$0" "$@"' ''', desc = "file(1) on hovered (float)" },
    { on = ["c", "d"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-float.sh "du -sh %F" "$0" "$@"' ''', desc = "du -sh selection (float)" },
    { on = ["c", "g"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-float.sh "lazygit -p %d" "$0" "$@"' ''', desc = "lazygit on cwd (float)" },
    { on = ["c", "c"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-ask.sh "$0" "$@"' ''', desc = "Custom command (float, prompt)" },
    { on = ["c", "n"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-newtab.sh "$0" "$@"' ''', desc = "Command in new tab" },
    { on = ["c", "s"], run = '''shell --orphan 'bash /home/mknelo/.config/zellij/scripts/yazi-newtab-shell.sh' ''', desc = "Open shell in new tab" }
]
