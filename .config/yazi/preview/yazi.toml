# yazi-preview (grs explore tab, bottom-left)
# Maximiza el panel de preview. Mantiene una columna fina con el archivo bajo
# cursor porque yazi requiere current visible.
[mgr]
ratio = [0, 0, 8]
# Sin esto, reveal remoto sobre un hidden substituye y rompe el echo guard.
show_hidden = true

[preview]
wrap = "yes"

[opener]
edit = [
  { run = ':', desc = "noop (preview)", block = false, for = "unix" },
]
